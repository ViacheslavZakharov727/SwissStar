<!doctype html><html lang='de'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width, initial-scale=1'/><title>SwissStar</title><link rel='stylesheet' href='style.css'/></head><body id='page-contact' class='page-enter'>
<header class="header">
  <div class="container nav">
    <div class="nav-left">
      <a class="logo" href="index.html">
        <img src="assets/logo.png" alt="SwissStar logo"/><span>Swiss&nbsp;Star</span>
      </a>
      <a href="index.html" data-i18n="nav.home">Home</a>
      <a href="about.html" data-i18n="nav.about">Über uns</a>
      <a href="network.html" data-i18n="nav.network">Netz</a>
      <a href="buy.html" data-i18n="nav.buy">Nummer kaufen</a>
      <a href="careers.html" data-i18="nav.careers" data-i18n="nav.careers">Karriere</a>
      <a href="contact.html" data-i18n="nav.contact">Kontakt</a>
    </div>
    <div class="nav-right">
      <select id="lang" class="lang-select" aria-label="Language">
        <option value="de">DE</option>
        <option value="fr">FR</option>
        <option value="it">IT</option>
      </select>
      <a class="login-btn" href="login.html" data-i18n="nav.login">Login</a>
    </div>
  </div>
</header>
<main>
<section class="section">
  <div class="container card">
    <h2 data-i18n="contact.title">Contact us</h2>
    <p class="lead" data-i18n="contact.lead">Tell us why you’re contacting us and how we can help. Our team replies quickly.</p>
    <div class="form" style="display:grid;gap:12px;margin-top:12px;max-width:720px">
      <label for="reason" data-i18n="contact.reasonLabel">Reason</label>
      <select id="reason">
        <option value="blocked" data-i18n="contact.reasons.blocked">My number was blocked</option>
        <option value="network" data-i18n="contact.reasons.network">Network error</option>
        <option value="stolen" data-i18n="contact.reasons.stolen">My number was stolen</option>
        <option value="other" data-i18n="contact.reasons.other">Other issue</option>
      </select>
      <label for="desc" data-i18n="contact.descLabel">Describe your issue</label>
      <textarea id="desc"></textarea>
      <button type="button" onclick="alert('Demo only')" data-i18n="contact.send">Send message</button>
    </div>
  </div>
</section>
</main>
<footer class="footer">
  <div class="container">
    The SwissStar website was created in 2025 — © 2025 SwissStar. All rights reserved.
  </div>
  <script src="script.js"></script>
</footer>
</body></html>
